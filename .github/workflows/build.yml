name: Build Fabric 26.2 Prices
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build standalone prices
        run: ./gradlew clean build --no-daemon
      - name: Verify standalone jar
        run: |
          python3 - <<'PY'
          import json, zipfile
          jar = 'build/libs/FirmamentPrices-1.1.0+26.2.jar'
          with zipfile.ZipFile(jar) as z:
              mod = json.loads(z.read('fabric.mod.json'))
              assert mod['id'] == 'firmament_prices'
              assert mod['depends']['minecraft'] == '26.2'
              assert not any('features/' in name or 'mixins/' in name for name in z.namelist())
              assert 'moe/nea/firmament/prices/FirmamentPrices.class' in z.namelist()
              assert 'moe/nea/firmament/prices/internal/moulconfig/gui/MoulConfigEditor.class' in z.namelist()
              assert any(n.startswith('META-INF/jars/fabric-language-kotlin') for n in z.namelist())
              assert mod['jars']
              assert all(j['file'] in z.namelist() for j in mod['jars'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: FirmamentPrices-fabric-26.2
          path: build/libs/FirmamentPrices-1.1.0+26.2.jar
          if-no-files-found: error
