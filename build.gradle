plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.1'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.4.1'
}
version = '1.1.0+26.2'
group = 'moe.nea.firmament.prices'
base { archivesName = 'FirmamentPrices' }
repositories {
    mavenCentral()
    maven { url = 'https://maven.notenoughupdates.org/releases/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}
configurations { guiLibrary }
configurations.implementation.extendsFrom(configurations.guiLibrary)
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'
    guiLibrary 'org.notenoughupdates.moulconfig:modern-26.2:4.8.0'
    implementation 'net.fabricmc:fabric-language-kotlin:1.13.12+kotlin.2.4.0'
    include 'net.fabricmc:fabric-language-kotlin:1.13.12+kotlin.2.4.0'
    compileOnly 'com.terraformersmc:modmenu:20.0.3'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
test { useJUnitPlatform() }
jar { from('LICENSES/GPL-3.0-or-later.txt') { rename { 'LICENSE' } }; from('NOTICE') }

loom { accessWidenerPath = file('src/main/resources/firmament_prices.accesswidener') }
jar { archiveClassifier = 'thin' }
shadowJar {
    archiveClassifier = ''
    configurations = []
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ project.configurations.guiLibrary.collect { zipTree(it).matching { exclude 'fabric.mod.json', 'moulconfig.accesswidener' } } })
    relocate 'io.github.notenoughupdates.moulconfig', 'moe.nea.firmament.prices.internal.moulconfig'
    mergeServiceFiles()
    from('LICENSES/GPL-3.0-or-later.txt') { rename { 'LICENSE' } }
    from('LICENSES/GPL-3.0-or-later.txt')
    from('LICENSES/LGPL-3.0-or-later.txt')
    from('NOTICE')
    // The regular jar's include processor adds this descriptor; Shadow starts from raw resources.
    filesMatching('fabric.mod.json') {
        def firstLine = true
        filter { String line ->
            if (firstLine) {
                firstLine = false
                def nested = new java.util.zip.ZipFile(tasks.jar.archiveFile.get().asFile).withCloseable { zip ->
                    new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry('fabric.mod.json'))).jars
                }
                return line.replaceFirst('\\{', '{"jars":' + groovy.json.JsonOutput.toJson(nested) + ',')
            }
            return line
        }
    }
    dependsOn tasks.jar
    from({ zipTree(tasks.jar.archiveFile.get().asFile) }) { include 'META-INF/jars/**' }
}
assemble { dependsOn shadowJar }
